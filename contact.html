<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario de contacto de Aura Coffee.">
    <meta name="author" content="Nacho Gomez">
    <title>Aura Coffee - Sobre Nosotros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header>
        <div class="header-container">
            <a href="index.html">
                <img src="Imagenes/logo_AuraCoffee.png" alt="Aura Coffee Logo" class="logo">
            </a>
            <div class="navegacion">
                <ul>
                    <li><a href="index.html">INICIO</a></li>
                    <li><a href="about.html">SOBRE NOSOTROS</a></li>
                    <li><a href="products.html">NUESTROS CAFÉS</a></li>
                    <li><a href="contact.html">CONTACTO</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main>
        <h2>Ponte en contacto con nosotros</h2>
        <p>¿Tienes dudas sobre qué café elegir? Escríbenos y te asesoramos.</p>


        <form>
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            <div>
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div>
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
            </div>
            <button type="submit">Enviar Mensaje</button>
        </form>
    </main>

    <footer>
        <p>Síguenos en @auracoffee.es</p>
    </footer>

</body>
</html>
